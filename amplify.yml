version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24.19.0
        - nvm use 24.19.0
        - corepack enable
        - corepack prepare pnpm@11.1.1 --activate
        - pnpm config set --location=project --json allowBuilds '{"esbuild":true,"sharp":true}'
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm sync:content
        - pnpm run build
    postBuild:
      commands:
        - test -n "${AMPLIFY_TARGET_APP_ID:-}"
        - test -f .amplify-hosting/customRules.json
        - aws amplify update-app --app-id "${AMPLIFY_TARGET_APP_ID}" --custom-rules "$(<.amplify-hosting/customRules.json)" --query 'app.appId' --output text >/dev/null
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
