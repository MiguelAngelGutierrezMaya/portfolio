AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Private, versioned content store consumed by the Migudev Amplify runtime.

Parameters:
  AmplifyAppId:
    Type: String
    Default: d33vi6wxgzyqpm
  ContentBucketName:
    Type: String
    Default: migudev-portfolio-content-108703089452-us-east-2

Resources:
  ContentKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts private Migudev portfolio content and media.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
      Tags:
        - Key: Project
          Value: migudev-portfolio

  ContentKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/migudev-portfolio-content
      TargetKeyId: !Ref ContentKey

  ContentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ContentBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt ContentKey.Arn
              SSEAlgorithm: aws:kms
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: RetainContentHistory
            Status: Enabled
            Prefix: content/
            NoncurrentVersionExpiration:
              NewerNoncurrentVersions: 10
              NoncurrentDays: 365
          - Id: ArchiveMediaHistory
            Status: Enabled
            Prefix: media/
            NoncurrentVersionTransitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER
                TransitionInDays: 90
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 180
            NoncurrentVersionExpiration:
              NewerNoncurrentVersions: 3
              NoncurrentDays: 730
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: migudev-portfolio
        - Key: DataClassification
          Value: private-editorial-content

  ContentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ContentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ContentBucket.Arn
              - !Sub ${ContentBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  AmplifyContentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: MigudevPortfolioAmplifyContentRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}*
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: RequestPortfolioContentDownloads
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokePrivateContentPresigner
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ContentPresigner.Arn
              - Sid: ApplyAmplifyRoutingRules
                Effect: Allow
                Action:
                  - amplify:GetApp
                  - amplify:UpdateApp
                Resource: !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}
      Tags:
        - Key: Project
          Value: migudev-portfolio

  AmplifyContentComputeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: MigudevPortfolioAmplifyComputeRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadRuntimePortfolioContent
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadManagedObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub ${ContentBucket.Arn}/content/*
                  - !Sub ${ContentBucket.Arn}/media/projects/*
              - Sid: DecryptManagedObjects
                Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt ContentKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub s3.${AWS::Region}.${AWS::URLSuffix}
                  StringLike:
                    kms:EncryptionContext:aws:s3:arn:
                      - !Sub ${ContentBucket.Arn}/content/*
                      - !Sub ${ContentBucket.Arn}/media/projects/*
      Tags:
        - Key: Project
          Value: migudev-portfolio

  ContentPresignerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: MigudevPortfolioContentPresignerRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PresignVersionedPortfolioContent
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadManagedObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub ${ContentBucket.Arn}/content/*
                  - !Sub ${ContentBucket.Arn}/media/*
              - Sid: DecryptManagedObjects
                Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt ContentKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub s3.${AWS::Region}.${AWS::URLSuffix}
                  StringLike:
                    kms:EncryptionContext:aws:s3:arn:
                      - !GetAtt ContentBucket.Arn
                      - !Sub ${ContentBucket.Arn}/*
              - Sid: CreateLogGroup
                Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/migudev-portfolio-content-presigner:*
      Tags:
        - Key: Project
          Value: migudev-portfolio

  ContentPresigner:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: migudev-portfolio-content-presigner
      Description: Creates five-minute downloads for allowlisted private portfolio content.
      Architectures:
        - arm64
      Runtime: nodejs24.x
      Handler: handler.handler
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt ContentPresignerRole.Arn
      Environment:
        Variables:
          CONTENT_BUCKET: !Ref ContentBucket
      CodeUri: functions/content-presigner/
      Tags:
        Project: migudev-portfolio
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - handler.ts
        Format: cjs
        Minify: true
        Sourcemap: false
        Target: es2022

Outputs:
  BucketName:
    Value: !Ref ContentBucket
  ContentKeyArn:
    Value: !GetAtt ContentKey.Arn
  AmplifyContentRoleArn:
    Value: !GetAtt AmplifyContentRole.Arn
  AmplifyContentComputeRoleArn:
    Value: !GetAtt AmplifyContentComputeRole.Arn
  ContentPresignerFunctionName:
    Value: !Ref ContentPresigner
