AWSTemplateFormatVersion: '2010-09-09'
Description: Private, versioned content store consumed by the Migudev Amplify build.

Parameters:
  AmplifyAppId:
    Type: String
    Default: d33vi6wxgzyqpm
  ContentBucketName:
    Type: String
    Default: migudev-portfolio-content-108703089452-us-east-2

Resources:
  ContentKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts private Migudev portfolio content and media.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
      Tags:
        - Key: Project
          Value: migudev-portfolio

  ContentKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/migudev-portfolio-content
      TargetKeyId: !Ref ContentKey

  ContentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ContentBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt ContentKey.Arn
              SSEAlgorithm: aws:kms
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: RetainContentHistory
            Status: Enabled
            Prefix: content/
            NoncurrentVersionExpiration:
              NewerNoncurrentVersions: 10
              NoncurrentDays: 365
          - Id: ArchiveMediaHistory
            Status: Enabled
            Prefix: media/
            NoncurrentVersionTransitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER
                TransitionInDays: 90
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 180
            NoncurrentVersionExpiration:
              NewerNoncurrentVersions: 3
              NoncurrentDays: 730
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: migudev-portfolio
        - Key: DataClassification
          Value: private-editorial-content

  ContentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ContentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ContentBucket.Arn
              - !Sub ${ContentBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  AmplifyContentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: MigudevPortfolioAmplifyContentRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}*
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: RequestPortfolioContentDownloads
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokePrivateContentPresigner
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ContentPresigner.Arn
      Tags:
        - Key: Project
          Value: migudev-portfolio

  ContentPresignerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: MigudevPortfolioContentPresignerRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PresignVersionedPortfolioContent
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadManagedObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub ${ContentBucket.Arn}/content/*
                  - !Sub ${ContentBucket.Arn}/media/*
              - Sid: DecryptManagedObjects
                Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt ContentKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub s3.${AWS::Region}.${AWS::URLSuffix}
                  StringLike:
                    kms:EncryptionContext:aws:s3:arn:
                      - !GetAtt ContentBucket.Arn
                      - !Sub ${ContentBucket.Arn}/*
              - Sid: CreateLogGroup
                Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/migudev-portfolio-content-presigner:*
      Tags:
        - Key: Project
          Value: migudev-portfolio

  ContentPresigner:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: migudev-portfolio-content-presigner
      Description: Creates five-minute downloads for allowlisted private portfolio content.
      Architectures:
        - arm64
      Runtime: python3.13
      Handler: index.handler
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt ContentPresignerRole.Arn
      Environment:
        Variables:
          CONTENT_BUCKET: !Ref ContentBucket
      Code:
        ZipFile: |
          import os
          import boto3
          from botocore.config import Config

          bucket = os.environ["CONTENT_BUCKET"]
          region = os.environ["AWS_REGION"]
          s3 = boto3.client(
              "s3",
              region_name=region,
              endpoint_url=f"https://s3.{region}.amazonaws.com",
              config=Config(
                  signature_version="s3v4",
                  s3={"addressing_style": "virtual"},
              ),
          )
          allowed_prefixes = (
              "content/",
              "media/brand/",
              "media/profile/",
              "media/projects/",
          )

          def handler(event, _context):
              key = event.get("key") if isinstance(event, dict) else None
              if not isinstance(key, str) or ".." in key:
                  raise ValueError("Invalid content key")
              if not any(key.startswith(prefix) for prefix in allowed_prefixes):
                  raise ValueError("Content key is outside the managed prefixes")

              return {
                  "url": s3.generate_presigned_url(
                      "get_object",
                      Params={"Bucket": bucket, "Key": key},
                      ExpiresIn=300,
                      HttpMethod="GET",
                  ),
                  "expiresIn": 300,
              }
      Tags:
        - Key: Project
          Value: migudev-portfolio

Outputs:
  BucketName:
    Value: !Ref ContentBucket
  ContentKeyArn:
    Value: !GetAtt ContentKey.Arn
  AmplifyContentRoleArn:
    Value: !GetAtt AmplifyContentRole.Arn
  ContentPresignerFunctionName:
    Value: !Ref ContentPresigner
