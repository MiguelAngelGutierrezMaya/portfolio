    'eslint-plugin-jsx-a11y>eslint': '10'
overrides:
  '@babel/core@<7.29.1': 7.29.7
  'ajv@>=8.0.0 <8.18.0': 8.18.0
  'brace-expansion@<1.1.18': 1.1.18
  'fast-uri@<3.1.5': 3.1.5
  'flatted@<3.4.2': 3.4.2
  'lighthouse@12.6.1': 13.4.1
  'minimatch@>=3.0.0 <3.1.4': 3.1.4
  'mdast-util-to-hast@>=13.0.0 <13.2.1': 13.2.1
  'nanoid@<3.3.18': 3.3.18
  'picomatch@<2.3.2': 2.3.2
  'picomatch@>=4.0.0 <4.0.5': 4.0.5
  'proxy-agent@<8.0.1': 8.0.2
  'tmp@<0.2.7': 0.2.7
  'uuid@<11.1.1': 11.1.1
