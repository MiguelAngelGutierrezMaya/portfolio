packages:
  - 'tools/*'

allowBuilds:
  esbuild: true
peerDependencyRules:
  allowedVersions:
    # eslint-plugin-astro 3 requires both ESLint 10 and jsx-a11y 6.10.2.
    'eslint-plugin-jsx-a11y>eslint': '10'
overrides:
  # Keep Astro's WASM compiler and language tools on the same stable ABI.
  '@emnapi/core': 1.11.3
  '@emnapi/runtime': 1.11.3
  # Security floors for transitive packages retained by upstream lockfile ranges.
  'basic-ftp@<6.2.1': 6.2.1
  'body-parser@<1.20.9': 1.20.9
  'compression@<1.8.2': 1.8.2
  'devalue@>=5.0.0 <5.9.3': 5.9.3
  'ip-address@>=10.0.0 <10.7.4': 10.7.4
  'js-yaml@>=3.0.0 <3.15.2': 3.15.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'postcss-selector-parser@>=7.0.0 <7.1.6': 7.1.6
  'proxy-addr@>=1.1.0 <2.0.8': 2.0.8
  'smol-toml@<1.9.1': 1.9.1
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'undici@>=8.0.0 <8.12.2': 8.12.2
  'vite@>=8.0.0 <8.3.5': ^8.3.5
  'zod@>=4.0.0 <4.6.6': 4.6.7
  '@babel/core@<7.29.1': 7.29.7
  'ajv@>=8.0.0 <8.18.0': ^8.18.0
  'browserslist@<=4.28.6': 4.28.7
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'flatted@<3.4.2': 3.4.2
  'lighthouse@12.6.1': 13.5.0
  'minimatch@>=3.0.0 <3.1.4': 3.1.4
  'mdast-util-to-hast@>=13.0.0 <13.2.1': 13.2.1
  'nanoid@<3.3.18': 3.3.18
  'picomatch@<2.3.2': 2.3.2
  'picomatch@>=4.0.0 <4.0.5': 4.0.5
  'proxy-agent@<8.0.1': 8.0.2
  'qs@<6.16.0': 6.16.0
  'tmp@<0.2.7': 0.2.7
  'uuid@<11.1.1': 11.1.1
